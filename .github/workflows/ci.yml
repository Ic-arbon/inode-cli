name: CI

on:
  push:
  pull_request:

jobs:
  nix-build:
    name: nix build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: x86_64-linux
          - os: ubuntu-24.04-arm
            label: aarch64-linux
          - os: macos-15-intel
            label: x86_64-darwin
          - os: macos-15
            label: aarch64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: DeterminateSystems/magic-nix-cache-action@v8
        with:
          # FlakeHub cache requires a separate FlakeHub account; keep only
          # the GitHub Actions cache so CI works without extra auth.
          use-flakehub: false

      - name: Flake check
        run: nix flake check --print-build-logs

      - name: Build Rust workspace package
        run: nix build .#inode --print-build-logs --print-out-paths

      - name: Build H3C fork
        run: nix build .#inode-openconnect --print-build-logs --print-out-paths
